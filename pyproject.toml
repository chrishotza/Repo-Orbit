[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repoorbit-agent"
version = "0.4.0"
description = "Evidence-first, minimal-context repository discovery tools for AI agents"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["repoorbit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
