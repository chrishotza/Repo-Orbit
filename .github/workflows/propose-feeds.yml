name: Propose reviewed feed updates

on:
  schedule:
    # Weekly; GitHub may delay scheduled workflows.
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repoorbit-approved-feed-proposals
  cancel-in-progress: false

jobs:
  propose:
    name: Prepare validated, draft-only corpus PR
    if: github.repository == 'chrishotza/Repo-Orbit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Avoid overwriting an unreviewed bot proposal
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("bot/feed-refresh-"))] | length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "::notice::An existing bot feed PR awaits review. Skipping new proposal."
          fi
      - name: Check licensed allowlist and approved snapshots
        if: steps.pending.outputs.count == '0'
        run: python -m repoorbit.refresh --check
      - name: Collect current sources into ignored staging area
        if: steps.pending.outputs.count == '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m repoorbit.refresh
      - name: Prepare conservative reviewable promotion
        if: steps.pending.outputs.count == '0'
        run: python -m repoorbit.promote --apply
      - name: Validate promoted corpus and machine indexes
        if: steps.pending.outputs.count == '0'
        run: |
          python scripts/corpus.py validate
          python scripts/discoveries.py validate
          python -m repoorbit.refresh --check
          python -m repoorbit.build_status
          python -m repoorbit.build_index
          python -m repoorbit.build_intent_index
          python -m unittest discover -s tests -v
      - name: Open draft PR only if approved source references changed
        if: steps.pending.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/feeds.json data/discoveries/ ai/terms/ ai/status.json
          if git diff --cached --quiet; then
            echo "::notice::No reference changes versus approved pinned baselines."
            exit 0
          fi
          branch="bot/feed-refresh-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: propose licensed feed update for review"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "Corpus: review licensed feed updates" \
            --body "Generated by rights-gated RepoOrbit refresh. Includes only source-approved GitHub references, versioned immutable snapshots and regenerated token-efficient indexes. Historical snapshots are retained. Automatic merge is disabled. Review added/removed URLs, source hashes, licenses, and CI before merging."
