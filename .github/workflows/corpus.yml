name: Corpus integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: Validate corpus (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline corpus validation
        run: python scripts/corpus.py validate
      - name: Offline corpus statistics
        run: python scripts/corpus.py stats
      - name: Discovery edge validation
        run: python scripts/discoveries.py validate
      - name: Discovery edge counts
        run: python scripts/discoveries.py stats
      - name: Verify AI term index reproducibility
        run: python -m repoorbit.build_index
      - name: MCP stdio smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search","arguments":{"q":"mcp","limit":2}}}' | python -m repoorbit.mcp > /tmp/repoorbit-mcp.jsonl
          python -c 'import json; r=[json.loads(x) for x in open("/tmp/repoorbit-mcp.jsonl")]; assert len(r)==3 and len(r[2]["result"]["content"])==1'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
