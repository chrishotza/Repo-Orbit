name: Corpus integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: Validate corpus (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline corpus validation
        run: python scripts/corpus.py validate
      - name: Offline corpus statistics
        run: python scripts/corpus.py stats
      - name: Discovery edge validation
        run: python scripts/discoveries.py validate
      - name: Discovery edge counts
        run: python scripts/discoveries.py stats
      - name: Verify allowed licensed feeds and snapshot baselines
        run: python -m repoorbit.refresh --check
      - name: Verify GitHub numeric identity registry offline
        run: python -m repoorbit.identity_watch --check
      - name: Verify compact numeric identity index reproducibility
        run: python -m repoorbit.build_identity_index
      - name: Validate checked discovery identities and pending queue
        run: python -m repoorbit.check_targets --check --limit 3
      - name: Verify checked-reference AI manifest
        run: python -m repoorbit.build_verified_index
      - name: Validate README subject evidence metadata offline
        run: python -m repoorbit.audit_topics --check
      - name: Verify bilingual topic aliases and 32 contractual probes
        run: python -m repoorbit.evaluate_topics
      - name: Validate staged README queue offline
        run: python -m repoorbit.stage_readmes --check --limit 2
      - name: Verify 16 deterministic topic shards
        run: python -m repoorbit.build_taxonomy_index
      - name: Verify machine-readable corpus status
        run: python -m repoorbit.build_status
      - name: Verify AI term index reproducibility
        run: python -m repoorbit.build_index
      - name: Verify bilingual intent index reproducibility
        run: python -m repoorbit.build_intent_index
      - name: MCP stdio smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search","arguments":{"q":"mcp","limit":2}}}' '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"recommend","arguments":{"q":"generar videos gratis","limit":1}}}' '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"resolve","arguments":{"repo":"id:589831718"}}}' | python -m repoorbit.mcp > /tmp/repoorbit-mcp.jsonl
          python -c 'import json; r=[json.loads(x) for x in open("/tmp/repoorbit-mcp.jsonl")]; assert len(r)==5 and len(r[2]["result"]["content"])==1 and json.loads(r[3]["result"]["content"][0]["text"])["warning"]=="cost_not_verified" and json.loads(r[4]["result"]["content"][0]["text"])["github_id"]==589831718'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
