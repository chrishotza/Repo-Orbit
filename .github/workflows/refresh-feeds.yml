name: Rights-reviewed feed refresh

on:
  schedule:
    # Daily at 04:17 UTC; GitHub Actions scheduled runs may start late.
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'repoorbit/refresh.py'
      - 'repoorbit/incremental_delta.py'
      - 'repoorbit/promote.py'
      - 'data/feeds.json'
      - '.github/workflows/refresh-feeds.yml'

permissions:
  contents: read

concurrency:
  group: repoorbit-feed-refresh
  cancel-in-progress: false

jobs:
  stage:
    name: Check six reviewed CC0 feeds and stage source-aware deltas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source registry, licensed feeds and baselines (offline)
        run: python -m repoorbit.refresh --check
      - name: Refresh into gitignored staging directory (read-only API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m repoorbit.refresh
      - name: Verify global delta is present and machine-readable
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("data/snapshots/staged/global-delta.json"); x=json.loads(p.read_text()); assert x["status"]=="unreviewed_global_source_delta"; assert x["baseline_edges"]>=1; print(json.dumps({"source_delta":x["counts"],"baseline_edges":x["baseline_edges"],"proposed_edges":x["proposed_edges"]},separators=(",",":")))'
      - name: Upload staged diff report (no automatic changes to main)
        uses: actions/upload-artifact@v4
        with:
          name: repoorbit-cc0-feed-report
          path: data/snapshots/staged/
          retention-days: 14
          if-no-files-found: error
