name: Stage README review candidates

on:
  schedule:
    - cron: '31 7 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - 'repoorbit/stage_readmes.py'
      - 'tests/test_stage_readmes.py'
      - '.github/workflows/stage-readmes.yml'

permissions:
  contents: read

concurrency:
  group: repoorbit-untrusted-readme-candidates
  cancel-in-progress: false

jobs:
  stage:
    name: Small source-evidence sample (never auto-approve)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation of the deterministic pending queue
        run: |
          python -m repoorbit.stage_readmes --check --limit 2
          python -m unittest discover -s tests -p 'test_stage_readmes.py' -v
      - name: Check untrusted READMEs against immutable blobs (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python -m repoorbit.stage_readmes --limit 2
          else
            python -m repoorbit.stage_readmes --limit 5
          fi
      - name: Upload candidates separately for human/AI review
        uses: actions/upload-artifact@v4
        with:
          name: repoorbit-readme-candidates-unreviewed
          path: data/snapshots/readme_review/
          retention-days: 14
          if-no-files-found: error
