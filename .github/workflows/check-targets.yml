name: Check discovered reference IDs

on:
  schedule:
    # Daily UTC; each date selects a different pending page. No corpus writes.
    - cron: '21 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'repoorbit/verified.py'
      - 'repoorbit/check_targets.py'
      - 'repoorbit/build_verified_index.py'
      - 'data/verified_targets.jsonl'
      - 'ai/verified-targets.json'
      - '.github/workflows/check-targets.yml'

permissions:
  contents: read

concurrency:
  group: repoorbit-check-discovered-targets
  cancel-in-progress: false

jobs:
  check:
    name: Verify bounded GitHub references read-only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate verified records and agent index (offline)
        run: |
          python -m repoorbit.check_targets --check --limit 3
          python -m repoorbit.check_targets --check --limit 25 --cycle-date "$(date -u +%F)"
          python -m repoorbit.build_verified_index
      - name: Sample or stage GitHub ID checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python -m repoorbit.check_targets --limit 3 --delay 0.1
          else
            python -m repoorbit.check_targets --limit 25 --delay 0.4 --cycle-date "$(date -u +%F)"
          fi
      - name: Upload staged report without publishing unreviewed records
        uses: actions/upload-artifact@v4
        with:
          name: repoorbit-new-reference-id-evidence
          path: data/snapshots/target_checks/
          retention-days: 14
          if-no-files-found: error
